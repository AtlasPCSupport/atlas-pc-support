name: Auto-merge reviewed documentation

on:
  # Runs trusted base-branch code only. The job never checks out PR content.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ['Build launcher.ps1']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: documentation-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  reviewed-docs:
    runs-on: ubuntu-latest
    steps:
      # Metadata only: never check out or execute PR content with this write token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'auto-merge-ok';
            const candidates = context.payload.pull_request
              ? [context.payload.pull_request.number]
              : (context.payload.workflow_run?.pull_requests || []).map(p => p.number);
            function documentationOnly(file) {
              const permitted = p => p === 'README.md' || p === 'README.es.md' || /^docs\/.*\.md$/.test(p);
              return permitted(file.filename) && (!file.previous_filename || permitted(file.previous_filename));
            }
            for (const pull_number of [...new Set(candidates)]) {
              const args = { owner, repo, pull_number };
              const { data: pr } = await github.rest.pulls.get(args);
              if (pr.state !== 'open' || pr.draft || pr.user.login !== 'devin-ai-integration[bot]' ||
                  pr.base.ref !== 'main' || pr.head.repo?.id !== pr.base.repo.id) continue;
              const sha = pr.head.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, { ...args, per_page: 100 });
              const eligible = files.length > 0 && files.length === pr.changed_files && files.every(documentationOnly);
              if (!eligible) {
                if (pr.labels.some(l => l.name === label)) {
                  try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: label }); }
                  catch (error) { if (error.status !== 404) throw error; }
                }
                core.info('Sensitive or incomplete diff: human merge required.');
                continue;
              }
              const reviews = await github.paginate(github.rest.pulls.listReviews, { ...args, per_page: 100 });
              const latest = new Map();
              for (const review of reviews.sort((a,b) => a.id - b.id)) {
                if (review.state !== 'COMMENTED') latest.set(review.user.login, review);
              }
              if ([...latest.values()].some(r => r.state === 'CHANGES_REQUESTED')) continue;
              const approved = [...latest.values()].some(r => r.state === 'APPROVED' && r.commit_id === sha &&
                r.user.type === 'User' && r.user.login !== pr.user.login &&
                ['OWNER','MEMBER','COLLABORATOR'].includes(r.author_association));
              if (!approved) continue;
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'build.yml', head_sha: sha, per_page: 1 });
              const run = runs.data.workflow_runs[0];
              if (!run || run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 });
              if (!['build','windows-compat','worker'].every(name => jobs.filter(j => j.name === name && j.conclusion === 'success').length === 1)) continue;
              const { data: current } = await github.rest.pulls.get(args);
              if (current.head.sha !== sha || current.base.sha !== pr.base.sha || current.state !== 'open' || current.draft) continue;
              // The label is informational. A stale label never authorizes a merge.
              await github.rest.pulls.merge({ ...args, sha, merge_method: 'squash' });
            }
