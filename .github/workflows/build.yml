name: Build launcher.ps1

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'build.ps1'
      - 'get.ps1'
      - 'launcher.ps1'
      - 'launcher.ps1.sha256'
      - 'release-manifest.json'
      - 'onboarding/**'
      - 'api/cloudflare-worker/**'
      - 'tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -ErrorAction Stop
          # launcher.ps1 es autogenerado: se valida por AST mas abajo, no por linter.
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 |
                        Where-Object { $_.ScriptName -ne 'launcher.ps1' }
          $errors = @($findings | Where-Object Severity -eq 'Error')
          $warns  = @($findings | Where-Object Severity -eq 'Warning')
          foreach ($f in $findings) {
            $sev = switch ($f.Severity) { 'Error' { 'error' } 'Warning' { 'warning' } default { 'notice' } }
            Write-Host "::$sev file=$($f.ScriptPath),line=$($f.Line)::[$($f.RuleName)] $($f.Message)"
          }
          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warns.Count) warning(s)."
          # Por ahora el gate solo BLOQUEA en severidad Error. Las warnings se reducen por fases.
          if ($errors.Count -gt 0) { exit 1 }

      - name: Assert compiled artifacts are fresh (no stale launcher)
        shell: pwsh
        run: |
          # Corre ANTES del build de abajo, sobre el checkout pristino, para
          # detectar si alguien edito src/ sin reconstruir launcher.ps1.
          . ./tests/Assert-LauncherFresh.ps1

      - name: Security guards (bootstrap/runtime hardening)
        shell: pwsh
        run: |
          . ./tests/Test-SecurityGuards.ps1

      - name: Build launcher.ps1
        shell: pwsh
        run: |
          . ./build.ps1

      - name: Syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/launcher.ps1",
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error file=launcher.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "launcher.ps1 parsed cleanly ($(Get-Item launcher.ps1 | ForEach-Object { [math]::Round($_.Length/1KB,1) }) KB)"

      - name: Verify tools syntax
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem src/tools/Invoke-*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $fail++
              Write-Host "::error file=$($_.FullName)::Parse errors:"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($fail -gt 0) { exit 1 }

      - name: Validate embedded tool sources (roundtrip parse)
        shell: pwsh
        run: |
          . ./tests/Test-ToolSources.ps1

      - name: Unit tests (Pester v5)
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.8.0 -ErrorAction Stop
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 5.8.0 -Force
          Invoke-Pester -Path ./tests/*.Tests.ps1 -Output Detailed -CI

      - name: Upload complete verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release
          path: |
            get.ps1
            launcher.ps1
            launcher.ps1.sha256
            release-manifest.json
            config/tools.json
            config/dependencies.json
            config/tool-hashes.json
            src/tools/Invoke-*.ps1
            onboarding/install.bat

  windows-compat:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned test modules
        shell: powershell
        run: |
          Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.8.0 -ErrorAction Stop
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion 1.25.0 -ErrorAction Stop

      - name: Local baseline and real WPF load with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\Invoke-LocalChecks.ps1

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
